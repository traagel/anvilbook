name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: dev}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: uv run --extra server pytest -q
        env:
          ANVILBOOK_TEST_DATABASE_URL: postgresql://postgres:dev@localhost:5432/postgres
      - name: addon harnesses
        run: |
          for harness in tests/addon_harness.lua tests/addon_harness_modern.lua; do
            luajit "$harness" src/anvilbook/addon/AnvilbookExport/AnvilbookExport.lua
          done
